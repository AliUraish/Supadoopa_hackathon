[project]
name = "hackathon-backend"
version = "0.1.0"
description = "Python API: Stripe billing (Checkout, Billing, MPP pay-per-call) on Supabase"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.120,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.6,<3",
    # Majors pinned on purpose: both SDKs change shapes between releases.
    "stripe>=16,<17",
    "pympp[stripe]>=0.11,<0.12",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends() in defaults is the idiom
